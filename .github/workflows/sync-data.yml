name: Sync live data from Crete and Meta

# Runs the sync scripts directly on the GitHub Actions runner, against
# the same Supabase database the deployed site reads from — not via
# Vercel's /api/cron/sync route. Meta's Ad Library API can take minutes
# to paginate through ~2000 ads (that's Meta being slow, not our code),
# which blows straight through Vercel's 60s Hobby-plan function limit.
# GitHub Actions jobs default to a 6-hour timeout, so there's no
# equivalent ceiling here.
#
# Vercel's own Cron (see vercel.json) still hits /api/cron/sync once a
# day as a backup — it reliably covers TikTok/channel data, and covers
# ads too on the days Meta's API is in a better mood.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      ES_URL: ${{ secrets.ES_URL }}
      ES_API_KEY: ${{ secrets.ES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Sync Facebook, Instagram and TikTok from Crete
        run: npx tsx scripts/sync_crete.mts
      - name: Sync Meta ads
        run: npx tsx scripts/sync_meta_ads.mts
        # Deliberately NOT continue-on-error: an expired Meta token must turn the run red so it is noticed.
        # The Crete step above has already finished by now, so a Meta failure doesn't lose the posts data.
